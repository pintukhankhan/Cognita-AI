apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: {{- include "app.selector" . | nindent 6 }} }
  template:
    metadata:
      labels: {{- include "app.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: cognita
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports: [{ name: http, containerPort: 8000 }]
        envFrom:
        - configMapRef: { name: {{ include "app.fullname" . }}-config }
        - secretRef:    { name: {{ .Values.existingSecret }} }
        livenessProbe:
          httpGet: { path: {{ .Values.probes.liveness.path }}, port: http }
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelay }}
          periodSeconds: {{ .Values.probes.liveness.period }}
        readinessProbe:
          httpGet: { path: {{ .Values.probes.readiness.path }}, port: http }
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelay }}
          periodSeconds: {{ .Values.probes.readiness.period }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
