{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "app.fullname" . }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  selector: { matchLabels: {{- include "app.selector" . | nindent 6 }} }
  endpoints: [{ port: http, path: {{ .Values.monitoring.metricsPath }}, interval: {{ .Values.monitoring.interval }} }]
{{- end }}
