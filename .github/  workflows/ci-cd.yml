name: CI
on: [push, pull_request]
env: { IMAGE_NAME: cognita }
jobs:
  test:
    runs-on: ubuntu-latest
    services: { redis: { image: redis:7-alpine, ports: ["6379:6379"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt fakeredis pytest pytest-asyncio pytest-cov ruff
      - run: ruff check src tests
      - run: pytest tests/unit -q
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v5
        with: { context: ., file: docker/Dockerfile, push: false, tags: "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" }
